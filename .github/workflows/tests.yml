name: tests

on:
  push:
  pull_request:

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (CPU torch, no CLIP)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install Pillow==12.3.0 numpy==2.4.6 pytest==8.4.2
      - name: Fast tests (data, checkpoint, decision code, vegetable-model answers)
        run: python -m pytest -q
